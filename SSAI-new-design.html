  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

      // anchors, which closest()/IDL .target get wrong.

            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +

            'if (h.charAt(0) !== "#") {' +

              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');

      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>

      // attributes through, so match the full opening tag.

        var hi = headOpen.index + headOpen[0].length;

      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting

      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;

        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

text-2)\">{{ i.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 360px;gap:16px;margin-bottom:16px\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">Revenue by chatter<\u002Fdiv>\n          <div style=\"color:var(--text-3);font-size:12.5px;margin-bottom:16px\">Today vs team average ($268 / active hr)<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:13px\">\n            <sc-for list=\"{{ revBars }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <span style=\"flex:none;width:96px;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ b.name }}<\u002Fspan>\n                <div style=\"flex:1;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden\"><div style=\"height:100%;border-radius:6px;background:{{ b.color }};width:{{ b.w }}\"><\u002Fdiv><\u002Fdiv>\n                <span style=\"flex:none;width:56px;text-align:right;font-weight:600;font-size:12.5px;font-feature-settings:'tnum'\">{{ b.val }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column\">\n          <div style=\"font-size:15px;font-weight:600\">This period vs previous<\u002Fdiv>\n          <div style=\"color:var(--text-3);font-size:12.5px;margin-bottom:10px\">Team revenue trend<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center\">{{ vsPrevEl }}<\u002Fdiv>\n          <div style=\"display:flex;gap:16px;margin-top:8px\"><div style=\"display:flex;align-items:center;gap:6px;font-size:1 \u002Fspan>\n              <span style=\"text-align:right;font-weight:600;font-size:13.5px;font-feature-settings:'tnum'\">{{ r.rev }}<\u002Fspan>\n              <span style=\"text-align:right;font-size:12.5px;font-weight:600;font-feature-settings:'tnum';color:{{ r.dColor }}\">{{ r.revD }}<\u002Fspan>\n              <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.resp }}<\u002Fspan>\n              <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.sent }}<\u002Fspan>\n              <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.conv }}<\u002Fspan>\n              <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.rph }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ====== ANALYTICS: AI USAGE ====== -->\n    <sc-if value=\"{{ isAnAi }}\">\n    <div style=\"flex:1;overflow-y:auto;padding:24px 28px\">\n      <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px\">\n        <div><div style=\"font-size:19px;font-weight:700;letter-spacing:-.3px\">AI usage<\u002Fdiv><div style=\"color:var(--text-3);font-size:13.5px;margin-top:2px\">Adoption, the feedback loop, and the true cost &amp; profit of every message.<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 12px\">\n          <span style=\"font-size:12.5px;color:var(--text-3)\">Chatter pay<\u002Fspan>\n          <span style=\"font-size:13px;color:var(--text-3)\">$<\u002Fspan>\n          <input value=\"{{ salary }}\" onchange=\"{{ onSalary }}\" style=\"width:42px;border:none;outline:none;background:transparent;color:var(--text);font-size:14px;font-weight:600;font-feature-settings:'tnum'\">\n          <span style=\"font-size:12.5px;color:var(--text-3)\">/ hr<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px\">\n        <sc-for list=\"{{ aiSummary }}\" as=\"k\" hint-placeholder-count=\"6\">\n          <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;position:relative\">\n            <sc-if value=\"{{ k.owner }}\"><span style=\"position:absolute;top:12px;right:12px;display:flex;color:var(--text-3)\" title=\"Owner only\">{{ icLock }}<\u002Fspan><\u002Fsc-if>\n            <div style=\"font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">{{ k.label }}<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700;margin-top:7px;letter-spacing:-.3px;font-feature-settings:'tnum'\">{{ k.value }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;margin-top:5px;color:var(--text-3)\">{{ k.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">Which suggestion gets picked<\u002Fdiv>\n          <div style=\"color:var(--text-3);font-size:12.5px;margin-bottom:16px\">By tone · trains the model on what works<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ toneBars }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <span style=\"flex:none;width:80px;font-size:12.5px;color:var(--text-2)\">{{ b.label }}<\u002Fspan>\n                <div style=\"flex:1 span><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;background:var(--accent-soft);border-radius:11px;padding:13px;font-size:12.5px;line-height:1.55;color:var(--text)\"><span style=\"font-weight:600;color:var(--accent-text)\">Feedback loop:<\u002Fspan> every pick and edit trains the suggestion model. Acceptance is up +6 pts over 30 days, and messages that use a suggestion close <b>1.7×<\u002Fb> more often than hand-written ones.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px\">\n        <div style=\"display:flex;align-items:center;margin-bottom:16px\"><div style=\"font-size:15px;font-weight:600\">Cost &amp; profit per message<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><span style=\"font-size:12px;color:var(--text-3)\">Recomputes live from chatter pay above<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:0;align-items:center\">\n          <div style=\"text-align:center\"><div style=\"font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">AI cost<\u002Fdiv><div style=\"font-size:20px;font-weight:700;margin-top:6px;font-feature-settings:'tnum'\">{{ aiCostStr }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;color:var(--text-3);font-size:18px\">+<\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">Labor cost<\u002Fdiv><div style=\"font-size:20px;font-weight:700;margin-top:6px;font-feature-settings:'tnum'\">{{ laborCostStr }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;color:var(--text-3);font-size:18px\">=<\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">Total / msg<\u002Fdiv><div style=\"font-size:20px;font-weight:700;margin-top:6px;font-feature-settings:'tnum'\">{{ totalCostStr }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:var(--border-2);margin:18px 0\"><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n          <div style=\"background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:15px\"><div style=\"font-size:12px;color:var(--text-3)\">Revenue / message<\u002Fdiv><div style=\"font-size:22px;font-weight:700;margin-top:6px;font-feature-settings:'tnum'\">$3.66<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:15px\"><div style=\"font-size:12px;color:var(--text-3)\">Gross margin / msg<\u002Fdiv><div style=\"font-size:22px;font-weight:700;margin-top:6px;font-feature-settings:'tnum'\">{{ grossMarginStr }}<\u002Fdiv><\u002Fdiv>\n          <sc-if value=\"{{ isOwner }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:var(--accent-soft);border-radius:11px;padding:15px;position:relative\"><span style=\"position:absolute;top:13px;right:13px;display:flex;color:var(--accent-text)\">{{ icLock }}<\u002Fspan><div style=\"font-size:12px;color:var(--accent-text)\">Agency profit / msg<\u002Fdiv><div style=\"font-size:22px;font-weight:700;margin-top:6px;font-feature-settings:'tnum'\">{{ agencyProfitStr }}<\u002Fdiv><div style=\"font-size:11px;color:var(--text-3);margin-top:3px\">after creator cut · {{ blendedAgencyStr }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notOwner }}\">\n            <div style=\"background:var(--bg);border:1px dashed var(--border);border-radius:11px;padding:15px;display:flex;align-items:center;gap:10px;color:var(--text-3)\">{{ icLock }}<span style=\"font-size:12.5px\">Agency profit is visible to the Owner only<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- == adding:20px\"><div style=\"font-size:15px;font-weight:600;margin-bottom:16px\">QA score by chatter<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:13px\"><sc-for list=\"{{ qaChatters }}\" as=\"b\" hint-placeholder-count=\"5\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:84px;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ b.name }}<\u002Fspan><div style=\"flex:1;height:11px;border-radius:6px;background:var(--surface-2);overflow:hidden\"><div style=\"height:100%;border-radius:6px;background:{{ b.color }};width:{{ b.w }}\"><\u002Fdiv><\u002Fdiv><span style=\"flex:none;width:26px;text-align:right;font-weight:600;font-size:12.5px;font-feature-settings:'tnum'\">{{ b.val }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px\">\n        <div style=\"padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center\"><div style=\"font-size:15px;font-weight:600\">Blocked word attempts<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><span style=\"font-size:12px;color:var(--text-3)\">Live · from the blacklist<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ blockedLog }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border-2)\" style-hover=\"background:var(--surface-2)\">\n            <span style=\"flex:none;display:flex;color:var(--neg)\">{{ icLock }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:13.5px;color:var(--text)\">Blocked “<span style=\"font-weight:600;color:var(--neg)\">{{ r.word }}<\u002Fspan>” before send<\u002Fdiv><div style=\"font-size:12px;color:var(--text-3);margin-top:2px\">{{ r.chatter }} · {{ r.fan }}<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">{{ r.time }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden\">\n        <div style=\"padding:16px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600\">Flagged conversations<\u002Fdiv>\n        <sc-for list=\"{{ qaFlags }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border-2)\" style-hover=\"background:var(--surface-2)\">\n            <span style=\"flex:none;width:34px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:{{ r.scoreColor }};font-feature-settings:'tnum'\">{{ r.score }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:13.5px;color:var(--text);font-weight:500\">{{ r.issue }}<\u002Fdiv><div style=\"font-size:12px;color:var(--text-3);margin-top:2px\">{{ r.chatter }} · {{ r.fan }}<\u002Fdiv><\u002Fdiv>\n            <button style=\"flex:none;border:1px solid var(--border);background:transparent;color:var(--text-2);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:600\" style-hover=\"background:var(--surface-2)\">Review<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ====== CREATOR P&L ====== -->\n    <sc-if value=\"{{ isAnPl }}\">\n    <div style=\"flex:1;overflow-y:auto;padding:24px 28px\">\n      <div style=\"margin-bottom:18px\"><div style=\"font-size:19px;font-weight:700;letter-spacing:-.3px\">Creator P&amp;L<\u002Fdiv><div style=\"color:var(--text-3);font-size:13.5px;margin-top:2px\">Profit by creator and automated chatter payouts.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ isOwner }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px\"><sc-for list=\"{{ pnlKpis }}\" as=\"k\" hint-placeholder-count=\"4\"><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px\"><div style=\"font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">{{ k.label }}<\u002Fdiv><div style=\"font-size:21px;font-weight:700;margin-top:7px;letter-spacing:-.3px;font-feature-settings:'tnum'\">{{ k.value }}<\u002Fdiv><div style=\"font-size:11.5px;margin-top:5px;color:var(--text-3)\">{{ k.sub }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px\">\n          <div style=\"padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center\"><div style=\"font-size:15px;font-weight:600\">Creator P&amp;L<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><span style=\"font-size:12px;color:var(--text-3)\">Splits editable in Settings<\u002Fspan><\u002Fdiv>\n          <div style=\"overflow-x:auto\"><div style=\"min-width:900px\">\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr .72fr .92fr .92fr .85fr .8fr .9fr .78fr;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3)\"><span>Creator<\u002Fspan><span style=\"text-align:right\">Gross<\u002Fspan><span style=\"text-align:right\">Cut<\u002Fspan><span style=\"text-align:right\">Payout<\u002Fspan><span style=\"text-align:right\">Agency<\u002Fspan><span style=\"text-align:right\">Cost<\u002Fspan><span style=\"text-align:right\">CB<\u002Fspan><span style=\"text-align:right\">Net<\u002Fspan><span style=\"text-align:right\">Margin<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ pnlRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:1.3fr 1fr .72fr .92fr .92fr .85fr .8fr .9fr .78fr;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-2);align-items:center\" style-hover=\"background:var(--surface-2)\">\n                <span style=\"font-weight:600;font-size:13.5px\">{{ r.c }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.gross }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-3);font-feature-settings:'tnum'\">{{ r.cut }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.payout }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.agency }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-3);font-feature-settings:'tnum'\">{{ r.cost }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--neg);font-feature-settings:'tnum'\">{{ r.cb }}<\u002Fspan>\n                <span style=\"text-align:right;font-weight:700;font-size:13.5px;color:var(--pos);font-feature-settings:'tnum'\">{{ r.net }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.margin }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden\">\n          <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\"><div style=\"font-size:15px;font-weight:600\">Chatter payouts · auto-calculated<\u002Fdiv><div style=\"color:var(--text-3);font-size:12px;margin-top:3px;max-width:680px\">Chargebacks are deducted from attributed revenue before payout. A chargeback landing after a payout is not clawed back retroactively.<\u002Fdiv><\u002Fdiv>\n          <div style=\"overflow-x:auto\"><div style=\"min-width:720px\">\n            <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.2fr 1fr 1fr;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3)\"><span>Chatter<\u002Fspan><span style=\"text-align:right\">Hours<\u002Fspan><span style=\"text-align:right\">Rate<\u002Fspan><span style=\"text-align:right\">Base<\u002Fspan><span style=\"text-align:right\">Attributed<\u002Fspan><span style=\"text-align:right\">Comm 10%<\u002Fspan><span style=\"text-align:right\">Total<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ payoutRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.2fr 1fr 1fr;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-2);align-items:center\" style-hover=\"background:var(--surface-2)\">\n                <span style=\"font-weight:600;font-size:13.5px\">{{ r.name }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.hours }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-3);font-feature-settings:'tnum'\">{{ r.rate }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.base }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.rev }}<\u002Fspan>\n                <span style=\"text-align:right;font-size:13px;color:var(--text-2);font-feature-settings:'tnum'\">{{ r.comm }}<\u002Fspan>\n                <span style=\"text-align:right;font-weight:700;font-size:13.5px;font-feature-settings:'tnum'\">{{ r.total }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notOwner }}\">\n        <div style=\"background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:48px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text-3)\"><span style=\"display:flex\">{{ icLock }}<\u002Fspan><div style=\"font-size:14px;font-weight:600;color:var(--text-2)\">Creator P&amp;L is visible to the Owner only<\u002Fdiv><div style=\"font-size:12.5px\">Profit, creator splits and payouts are restricted.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ====== AUTOMATIONS ====== -->\n    <sc-if value=\"{{ isAutomations }}\">\n    <div style=\"flex:1;overflow-y:auto;padding:24px 28px\">\n      <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px\">\n        <div><div style=\"font-size:19px;font-weight:700;letter-spacing:-.3px\">Automations<\u002Fdiv><div style=\"color:var(--text-3);font-size:13.5px;margin-top:2px\">Always-on jobs, rule-based lists, and the best time to reach fans.<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px\"><sc-for list=\"{{ automationTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button onclick=\"{{ t.onClick }}\" style=\"border:none;cursor:pointer;border-radius:6px;padding:6px 13px;font-size:12.5px;font-weight:600;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ autoJobs }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px\">\n          <sc-for list=\"{{ automationJobs }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;display:flex;align-items:center;gap:14px\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:14.5px;font-weight:600\">{{ a.name }}<\u002Fspan><span style=\"font-size:11px;font-weight:600;color:{{ a.statusColor }}\">{{ a.statusText }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin:6px 0 8px\">Trigger · {{ a.trigger }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--text-2)\">{{ a.stat }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"flex:none;width:38px;height:22px;border-radius:11px;background:{{ a.trackBg }};position:relative;display:inline-block;cursor:pointer\"><span style=\"position:absolute;top:2px;{{ a.knobX }};width:18px;height:18px;border-radius:50%;background:#fff\"><\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ autoLists }}\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden\">\n          <div style=\"padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center\"><div style=\"font-size:15px;font-weight:600\">Rule-based lists<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><span style=\"font-size:12px;color:var(--text-3)\">Auto-updating segments<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.4fr 2fr .8fr;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)\"><span>List<\u002Fspan><span>Rule<\u002Fspan><span style=\"text-align:right\">Members<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ listRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:1.4fr 2fr .8fr;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-2);align-items:center\" style-hover=\"background:var(--surface-2)\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--accent)\"><\u002Fspan><span style=\"font-weight:600;font-size:13.5px\">{{ r.name }}<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:12.5px;color:var(--text-2);font-family:'JetBrains Mono',monospace\">{{ r.rule }}<\u002Fspan>\n              <span style=\"text-align:right;font-weight:600;font-size:13.5px;font-feature-settings:'tnum'\">{{ r.members }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ autoHeat }}\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px\"><div style=\"font-size:15px;font-weight:600\">When fans spend<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><button style=\"display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--text-2);font-size:12.5px;font-weight:500\" style-hover=\"background:var(--surface-2)\">{{ icFilter }}All creators{{ icChev }}<\u002Fbutton><\u002Fdiv>\n          <div style=\"color:var(--text-3);font-size:12.5px;margin-bottom:18px\">Spending activity by hour × day · use it to time mass messages<\u002Fdiv>\n          {{ heatmapEl }}\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:14px\"><span style=\"font-size:11px;color:var(--text-3)\">Less<\u00 erflow-y:auto;padding:24px 28px\">\n      <div style=\"margin-bottom:18px;display:flex;align-items:flex-start;gap:12px\">\n        <div><div style=\"font-size:19px;font-weight:700;letter-spacing:-.3px\">SSAI · CRM assistant<\u002Fdiv><div style=\"color:var(--text-3);font-size:13.5px;margin-top:2px;max-width:720px\">Ask in plain language across all CRM data — results, chatter stats, OFMM performance, comparisons across weeks and people. SSAI queries and summarises; caption &amp; OFMM generation stays in the Claude workflow.<\u002Fdiv><\u002Fdiv>\n        <span style=\"flex:none;display:flex;align-items:center;font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--warn);background:var(--c-tip-soft);border-radius:7px;padding:5px 10px;margin-top:3px\">Planned<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"max-width:760px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;justify-content:flex-end\"><div style=\"max-width:74%;background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px;padding:11px 15px;font-size:13.5px;line-height:1.5\">Hey SSAI, what are the results for WK24 for Sofia and Diego? Pull their OFMM performance alongside their rev/hr so we can compare.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px\">\n          <div style=\"flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center\">{{ icSparkle }}<\u002Fdiv>\n          <div style=\"flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:15px 16px\">\n            <div style=\"font-size:13.5px;line-height:1.6;color:var(--text)\">Here's WK24 (Jun 16–22) for both, combined across chatting and OFMM:<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0\">\n              <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px\"><div style=\"font-weight:700;font-size:13.5px;margin-bottom:8px\">Sofia Marin<\u002Fdiv><div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px\"><span style=\"color:var(--text-3)\">Revenue<\u002Fspan><span style=\"font-weight:600;font-feature-settings:'tnum'\">$2,310<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px\"><span style=\"color:var(--text-3)\">Rev / active hr<\u002Fspan><span style=\"font-weight:600;font-feature-settings:'tnum'\">$329<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;font-size:12.5px\"><span style=\"color:var(--text-3)\">OFMM attributed<\u002Fspan><span style=\"font-weight:600;font-feature-settings:'tnum'\">$4,180<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px\"><div style=\"font-weight:700;font-size:13.5px;margin-bottom:8px\">Diego Alvarez<\u002Fdiv><div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px\"><span style=\"color:var(--text-3)\">Revenue<\u002Fspan><span style=\"font-weight:600;font-feature-settings:'tnum'\">$1,180<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px\"><span style=\"color:var(--text-3)\">Rev / active hr<\u002Fspan><span style=\"font-weight:600;font-feature-settings:'tnum'\">$164<\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;font-size:12.5px\"><span style=\"color:var(--text-3)\">OFMM attributed<\u002Fspan><span style=\"font-weight:600;font-feature-settings:'tnum'\">$1,920<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.6;color:var(--text-2)\">Sofia is roughly 2× Diego on rev/active hr and her OFMM sends convert harder. Diego's chatting volume is comparable — the gap is on PPV closing, not effort.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 9px 9px 14px;margin-top:2px\">\n          <span style=\"flex:1;font-size:13.5px;color:var(--text-3)\">Ask SSAI anything about your CRM data…<\u002Fspan>\n          <button style=\"flex:none;display:flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 15px;cursor:pointer;font-size:13px;font-weight:600\">{{ icSend }}Ask<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ====== FAN PROFILE ====== -->\n    <sc-if value=\"{{ isFan }}\">\n    <div style=\"flex:1;overflow-y:auto;padding:24px 28px\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n        <button onclick=\"{{ onBackToChat }}\" style=\"flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--surface-2)\">{{ icChevLeft }}<\u002Fbutton>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)\">Fan profile<\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <span style=\"display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">{{ icRefresh }}Synced from OnlyFans · 4 min ago<\u002Fspan>\n        <button onclick=\"{{ onBackToChat }}\" style=\"display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13.5px;font-weight:600;margin-left:12px\" style-hover=\"filter:brightness(1.08)\">{{ icSend }}Open conversation<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:18px\">\n        <div style=\"height:120px;background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 11px,var(--bg) 11px,var(--bg) 22px);position:relative\">\n          <span style=\"position:absolute;right:12px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 8px\">OF cover photo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:0 22px 20px\">\n          <div style=\"flex:none;width:94px;height:94px;border-radius:50%;border:3px solid var(--surface);margin-top:-42px;background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 6px,var(--bg) 6px,var(--bg) 12px);display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-3);text-align:center;line-height:1.3\">fan<br>pfp<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px\"><span style=\"font-size:22px;font-weight:700;letter-spacing:-.3px\">{{ fanOf.displayName }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-3)\">{{ fanOf.username }}<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-text);border-radius:7px;padding:3px 9px\">Subscribed to {{ fan.creator }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.55;color:var(--text);margin-top:14px;max-width:580px\">{{ fanOf.bio }}<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:12.5px;color:var(--text-3)\">\n            <span style=\"display:flex;align-items:center;gap:6px\">{{ icGlobe }}{{ fanOf.location }}<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\">{{ icCalendar }}Joined {{ fanOf.joined }}<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\">{{ icClock }}Last seen {{ fanOf.lastSeen }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px\">\n        <sc-for list=\"{{ fanStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px\"><div style=\"font-size:12px;color:var(--text-3);font-family:'JetBrains Mono',monospace\">{{ s.label }}<\u002Fdiv><div style=\"font-size:19px;font-weight:700;margin-top:6px;letter-spacing:-.3px;font-feature-settings:'tnum'\">{{ s.value }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px\"><span style=\"display:flex;color:var(--accent-text)\">{{ icChart }}<\u002Fspan><div style=\"font-size:15px;font-weight:600\">PPV stats<\u002Fdiv><span style=\"flex:1\"><\u002Fspan><button onclick=\"{{ onOpenPpv }}\" style=\"display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:transparent;color:var(--accent-text);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600\" style-hover=\"background:var(--surface-2)\">{{ icExternal }}View timeline<\u002Fbutton><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n ><span style=\"font-size:12.5px;font-weight:600\">{{ fanCard.birthday }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:12.5px;color:var(--text-3)\">Local time<\u002Fspan><span style=\"font-size:12.5px;font-weight:600\">{{ fanCard.localTime }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:12.5px;color:var(--text-3)\">Fan origin<\u002Fspan><span style=\"font-size:12.5px;font-weight:600\">{{ fanCard.origin }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:12.5px;color:var(--text-3)\">Country<\u002Fspan><span style=\"font-size:12.5px;font-weight:600\">{{ fanCard.country }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-2)\">\n            <sc-for list=\"{{ fanLists }}\" as=\"l\" hint-placeholder-count=\"4\"><span style=\"font-size:11px;font-weight:500;background:var(--bg);border:1px solid var(--border);color:var(--text-2);border-radius:6px;padding:3px 9px\">{{ l.name }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:16px\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:16px\">Memory log<\u002Fdiv>\n          <sc-for list=\"{{ fan.memory }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:12px;padding-bottom:16px\"><div style=\"flex:none;display:flex;flex-direction:column;align-items:center\"><span style=\"width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:4px\"><\u002Fspan><span style=\"flex:1;width:1.5px;background:var(--border)\"><\u
