# SmartStars CRM — LOCAL DEV stack (full app in Docker, live reload).
#   cp .env.docker.dev.example .env.docker.dev   # required (git-ignored)
#   docker compose up -d --build
# Isolated from prod (name: ssai-dev). Prod stays:
#   docker compose -f compose.prod.yaml -f compose.caddy.yaml --env-file .env.docker ...
name: ssai-dev

# Shared config for the four PHP services (app/reverb/queue/scheduler). Only
# `app` carries `build:` so the dev image builds once; the rest reuse the tag.
x-php-dev: &php-dev
  image: ssai-dev/php:latest
  restart: unless-stopped
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - ./.env.docker.dev:/var/www/html/.env:ro
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [ssai-dev]

services:
  app:
    <<: *php-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["php-fpm"]
    environment:
      DEV_BOOTSTRAP: "true"   # this service owns composer install + migrate

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [ssai-dev]

  vite:
    # Runs in the dev image (php + node), NOT plain node: the Wayfinder Vite
    # plugin shells out to `php artisan wayfinder:generate` on startup, which
    # needs php + vendor/. The dev entrypoint also makes it wait for vendor/.
    <<: *php-dev
    # npm ci only when node_modules is empty; then start Vite with HMR.
    command: ["sh", "-c", "[ -f node_modules/.bin/vite ] || npm ci; exec npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_DOCKER: "1"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - ./.env.docker.dev:/var/www/html/.env:ro
    ports:
      - "5173:5173"

  engine:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["node", "--watch", "engine/server.js"]
    environment:
      ENGINE_HOST: "0.0.0.0"
      ENGINE_PORT: "8787"
    volumes:
      - .:/var/www/html
      - ./.env.docker.dev:/var/www/html/.env:ro
    ports:
      - "8787:8787"
    networks: [ssai-dev]

  reverb:
    <<: *php-dev
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"

  queue:
    <<: *php-dev
    command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0"]

  scheduler:
    <<: *php-dev
    command: ["php", "artisan", "schedule:work"]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "ssai_crm"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ssai-dev]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ssai-dev]

volumes:
  mysql-data:
  redis-data:
  vendor:
  node_modules:

networks:
  ssai-dev:
    driver: bridge
