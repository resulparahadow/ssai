; SmartStars — PHP-FPM pool override (replaces the image default www.conf).
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

; Dynamic process manager — tune numbers to the host's RAM/CPU.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; IMPORTANT: keep the real environment so Laravel sees Docker-provided env vars
; (DB_*, REDIS_*, provider keys). The default FPM strips them.
clear_env = no

; Surface worker logs on the container stream.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Enable the built-in status/ping endpoints for healthchecks.
pm.status_path = /status
ping.path = /ping
