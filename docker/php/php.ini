; SmartStars — production PHP overrides (loaded from $PHP_INI_DIR/conf.d/)
; Layered on top of the image's php.ini-production.

memory_limit = 512M
max_execution_time = 120

; Uploads / request body — headroom for media proxying and larger payloads.
upload_max_filesize = 25M
post_max_size = 30M

; Errors go to the container log stream, never to the client in production.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
date.timezone = UTC

; Make real environment variables ($_ENV / getenv) available to the app.
variables_order = "EGPCS"
