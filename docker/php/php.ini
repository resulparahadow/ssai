; SmartStars — production PHP overrides (loaded from $PHP_INI_DIR/conf.d/)
; Layered on top of the image's php.ini-production.

memory_limit = 512M
max_execution_time = 300

; Uploads / request body — headroom for media proxying and chat media uploads.
; post_max_size sits ABOVE upload_max_filesize: the multipart body carries the
; file PLUS fields. OnlyFans' own direct-upload cap is 100M (Cloudflare).
upload_max_filesize = 100M
post_max_size = 110M

; Errors go to the container log stream, never to the client in production.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
date.timezone = UTC

; Make real environment variables ($_ENV / getenv) available to the app.
variables_order = "EGPCS"
