# SmartStars — nginx site config (installed at /etc/nginx/conf.d/default.conf).
# Serves the built Laravel public/ directory, proxies PHP to the php-fpm
# container (app:9000) and the Reverb websocket to the reverb container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 110m;

    # Resolve app/reverb PER REQUEST via Docker's embedded DNS, never once at startup.
    # deploy.sh recreates `app` and `reverb` (new internal IPs) but leaves this container
    # running whenever the web image is unchanged (no frontend/nginx edit). A name resolved
    # at startup then points at the removed container and EVERY request 502s until nginx
    # restarts — that took prod down on 2026-09-26. A variable in fastcgi_pass/proxy_pass is
    # what makes nginx use `resolver` at request time; keep them variables.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream app:9000;
    set $reverb_upstream http://reverb:8080;

    # gzip for text-like assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss image/svg+xml application/wasm;

    # Reverb / Pusher websocket path (Laravel Echo connects to /app/{key}).
    location /app {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed Vite assets — long-lived immutable cache.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # A DRM video download (services.onlyfans.drm_timeout) can run for many minutes on
        # a slow link — keep this at or above it, or nginx cuts the request first.
        fastcgi_read_timeout 1800s;
    }

    # Never serve hidden files (e.g. .env) or version control metadata.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
